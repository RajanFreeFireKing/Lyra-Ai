name: lyra_mobile
description: "Lyra AI - Advanced Voice and Autonomous Screen Assistant for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  provider: ^6.1.2
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/prompt.md
    - assets/prompts/agent_prompt.md
    - assets/characters/female_soulmate.toml
    - assets/characters/male_jarvis.toml
    - assets/config/settings.toml
